<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D SOLAR SYSTEM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#space{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#title{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    font-size:clamp(20px,4vw,36px);
    font-weight:800;
    letter-spacing:4px;
    text-align:center;
    text-shadow:0 0 15px #00aaff,0 0 35px #0066ff;
    pointer-events:none;
}

#credit{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    font-size:12px;
    z-index:10;
    pointer-events:none;
}

#controls{
    position:fixed;
    top:75px;
    left:15px;
    z-index:20;
    width:190px;
    padding:14px;
    border:1px solid rgba(0,180,255,.35);
    border-radius:15px;
    background:rgba(5,10,25,.75);
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(0,100,255,.15);
    color:white;
}

#controls button{
    width:100%;
    margin-bottom:8px;
    padding:9px 8px;
    border:1px solid rgba(0,190,255,.4);
    border-radius:8px;
    background:rgba(0,100,180,.18);
    color:white;
    cursor:pointer;
    font-size:13px;
}

#controls button:hover{
    background:rgba(0,150,255,.35);
}

#controls label{
    display:block;
    font-size:12px;
    color:#b8dfff;
    margin-top:5px;
}

#speed{
    width:100%;
    margin-top:6px;
}

#info{
    display:none;
    position:fixed;
    right:15px;
    top:75px;
    z-index:30;
    width:min(310px,calc(100vw - 30px));
    max-height:calc(100vh - 100px);
    overflow:auto;
    padding:18px;
    border-radius:16px;
    border:1px solid rgba(0,190,255,.45);
    background:rgba(3,8,22,.88);
    backdrop-filter:blur(12px);
    color:#fff;
    box-shadow:0 0 35px rgba(0,100,255,.25);
}

#planetName{
    font-size:25px;
    margin-bottom:12px;
    color:#62d8ff;
}

#planetInfo{
    line-height:1.55;
    font-size:13px;
    color:#dceeff;
}

#backToSystem{
    width:100%;
    margin-top:15px;
    padding:10px;
    border:0;
    border-radius:9px;
    background:#087dcc;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#hint{
    position:fixed;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:#aaa;
    font-size:12px;
    text-align:center;
    pointer-events:none;
}

@media(max-width:600px){

    #controls{
        top:auto;
        bottom:48px;
        left:10px;
        width:150px;
        padding:9px;
    }

    #controls button{
        padding:7px;
        margin-bottom:5px;
        font-size:11px;
    }

    #controls label{
        font-size:10px;
    }

    #info{
        top:auto;
        bottom:48px;
        right:10px;
        width:calc(100vw - 170px);
        max-height:55vh;
        padding:12px;
    }

    #planetName{
        font-size:19px;
    }

    #planetInfo{
        font-size:11px;
    }

    #hint{
        bottom:10px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="space"></div>

<div id="title">3D SOLAR SYSTEM</div>

<div id="controls">

    <button id="pauseBtn">⏸ Pause</button>

    <button id="resetBtn">🌌 Reset Camera</button>

    <button id="orbitBtn">⭕ Hide Orbits</button>

    <button id="labelBtn">🏷 Hide Labels</button>

    <label>
        ⚡ Speed
        <input id="speed" type="range" min="0" max="5" step="0.1" value="1">
    </label>

</div>

<div id="info">

    <div id="planetName">Planet</div>

    <div id="planetInfo"></div>

    <button id="backToSystem">
        🌌 Back to Solar System
    </button>

</div>

<div id="hint">
    🖱 Drag to rotate • Scroll to zoom • Tap a planet for information
</div>

<div id="credit">
    Created by Ritesh
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const container = document.getElementById("space");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000005);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,75,165);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

container.appendChild(renderer.domElement);


/* =========================================================
   ORBIT CONTROLS
========================================================= */

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.minDistance = 5;
controls.maxDistance = 500;

controls.target.set(0,0,0);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight = new THREE.AmbientLight(
    0x555555,
    1
);

scene.add(ambientLight);

const sunLight = new THREE.PointLight(
    0xffffff,
    3,
    700
);

sunLight.position.set(0,0,0);

scene.add(sunLight);


/* =========================================================
   STAR FIELD
========================================================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 6000;

const starPositions = new Float32Array(
    starCount * 3
);

for(let i=0;i<starCount;i++){

    const radius = 500 + Math.random()*700;

    const theta = Math.random()*Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    starPositions[i*3] =
        radius*Math.sin(phi)*Math.cos(theta);

    starPositions[i*3+1] =
        radius*Math.cos(phi);

    starPositions[i*3+2] =
        radius*Math.sin(phi)*Math.sin(theta);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:1.3,
        transparent:true,
        opacity:.9
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =========================================================
   SUN
========================================================= */

const sunGeometry =
    new THREE.SphereGeometry(
        8,
        64,
        64
    );

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffaa00
    });

const sun =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

scene.add(sun);


/* SUN GLOW */

const glowGeometry =
    new THREE.SphereGeometry(
        11,
        32,
        32
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff6600,
        transparent:true,
        opacity:.18,
        side:THREE.BackSide
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(glow);


/* =========================================================
   PLANET DATA
========================================================= */

const planetData = [

    {
        name:"Mercury",
        distance:18,
        size:1.4,
        color:0x9b9187,
        speed:.040,
        rotation:.015,
        info:[
            "57.9 million km",
            "4,879 km",
            "88 Earth days",
            "58.6 Earth days"
        ]
    },

    {
        name:"Venus",
        distance:26,
        size:2.2,
        color:0xd6a15d,
        speed:.030,
        rotation:.009,
        info:[
            "108.2 million km",
            "12,104 km",
            "224.7 Earth days",
            "243 Earth days"
        ]
    },

    {
        name:"Earth",
        distance:35,
        size:2.5,
        color:0x2477d4,
        speed:.024,
        rotation:.025,
        info:[
            "149.6 million km",
            "12,742 km",
            "365.25 days",
            "23.9 hours"
        ]
    },

    {
        name:"Mars",
        distance:45,
        size:1.95,
        color:0xc64c32,
        speed:.019,
        rotation:.020,
        info:[
            "227.9 million km",
            "6,779 km",
            "687 Earth days",
            "24.6 hours"
        ]
    },

    {
        name:"Jupiter",
        distance:64,
        size:5.8,
        color:0xc99672,
        speed:.010,
        rotation:.045,
        info:[
            "778.5 million km",
            "139,820 km",
            "11.86 Earth years",
            "9.9 hours"
        ]
    },

    {
        name:"Saturn",
        distance:84,
        size:5.1,
        color:0xd8bd83,
        speed:.008,
        rotation:.040,
        info:[
            "1.43 billion km",
            "116,460 km",
            "29.45 Earth years",
            "10.7 hours"
        ]
    },

    {
        name:"Uranus",
        distance:104,
        size:3.55,
        color:0x79d7d7,
        speed:.006,
        rotation:.030,
        info:[
            "2.87 billion km",
            "50,724 km",
            "84 Earth years",
            "17.2 hours"
        ]
    },

    {
        name:"Neptune",
        distance:124,
        size:3.45,
        color:0x315bd6,
        speed:.005,
        rotation:.032,
        info:[
            "4.50 billion km",
            "49,244 km",
            "164.8 Earth years",
            "16.1 hours"
        ]
    }

];


/* =========================================================
   PLANET GROUPS
========================================================= */

const planets = [];

const planetGroups = [];


/* =========================================================
   CREATE ORBIT
========================================================= */

function createOrbit(radius){

    const points = [];

    for(
        let i=0;
        i<=128;
        i++
    ){

        const angle =
            i/128*Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(angle)*radius,
                0,
                Math.sin(angle)*radius
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({
            color:0x315d8c,
            transparent:true,
            opacity:.38
        });

    return new THREE.Line(
        geometry,
        material
    );
}


/* =========================================================
   PLANET LABEL
========================================================= */

function createLabel(text){

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold 42px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.shadowColor =
        "#00aaff";

    ctx.shadowBlur = 12;

    ctx.fillText(
        text,
        256,
        75
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(material);

    sprite.scale.set(
        12,
        3,
        1
    );

    return sprite;
}


/* =========================================================
   CREATE PLANETS
========================================================= */

planetData.forEach(function(data,index){

    const group =
        new THREE.Group();

    group.userData =
        data;

    const geometry =
        new THREE.SphereGeometry(
            data.size,
            48,
            48
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:data.color,
            roughness:.85,
            metalness:.02
        });

    const planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.userData =
        data;

    group.add(planet);

    group.userData.angle =
        index*0.9;

    group.userData.speed =
        data.speed;

    scene.add(group);

    planetGroups.push(group);

    planets.push(planet);


    /* ORBIT */

    const orbit =
        createOrbit(
            data.distance
        );

    scene.add(orbit);

    group.userData.orbit =
        orbit;


    /* LABEL */

    const label =
        createLabel(
            data.name
        );

    label.position.set(
        0,
        data.size+3,
        0
    );

    group.add(label);

    group.userData.label =
        label;


    /* =====================================================
       EARTH MOON
    ===================================================== */

    if(data.name === "Earth"){

        const moonOrbit =
            new THREE.Object3D();

        group.add(moonOrbit);

        const moonGeometry =
            new THREE.SphereGeometry(
                .65,
                24,
                24
            );

        const moonMaterial =
            new THREE.MeshStandardMaterial({
                color:0xaaaaaa,
                roughness:1
            });

        const moon =
            new THREE.Mesh(
                moonGeometry,
                moonMaterial
            );

        moon.position.x =
            data.size+3.5;

        moonOrbit.add(moon);

        group.userData.moon =
            moonOrbit;
    }


    /* =====================================================
       SATURN RINGS
    ===================================================== */

    if(data.name === "Saturn"){

        const ringGeometry =
            new THREE.RingGeometry(
                data.size*1.25,
                data.size*2.1,
                96
            );

        const ringMaterial =
            new THREE.MeshBasicMaterial({
                color:0xcab98e,
                side:THREE.DoubleSide,
                transparent:true,
                opacity:.75
            });

        const rings =
            new THREE.Mesh(
                ringGeometry,
                ringMaterial
            );

        rings.rotation.x =
            Math.PI/2;

        group.add(rings);
    }


    /* =====================================================
       URANUS RINGS
    ===================================================== */

    if(data.name === "Uranus"){

        const ringGeometry =
            new THREE.RingGeometry(
                data.size*1.3,
                data.size*1.65,
                64
            );

        const ringMaterial =
            new THREE.MeshBasicMaterial({
                color:0x8fd6d6,
                side:THREE.DoubleSide,
                transparent:true,
                opacity:.35
            });

        const rings =
            new THREE.Mesh(
                ringGeometry,
                ringMaterial
            );

        rings.rotation.x =
            Math.PI/2;

        group.add(rings);
    }

});


/* =========================================================
   ASTEROID BELT
========================================================= */

const asteroidGeometry =
    new THREE.DodecahedronGeometry(
        .12,
        0
    );

const asteroidMaterial =
    new THREE.MeshStandardMaterial({
        color:0x777777,
        roughness:1
    });

const asteroidCount = 500;

for(let i=0;i<asteroidCount;i++){

    const asteroid =
        new THREE.Mesh(
            asteroidGeometry,
            asteroidMaterial
        );

    const angle =
        Math.random()*Math.PI*2;

    const radius =
        50+Math.random()*10;

    asteroid.position.set(
        Math.cos(angle)*radius,
        (Math.random()-.5)*2,
        Math.sin(angle)*radius
    );

    asteroid.scale.setScalar(
        .5+Math.random()*1.5
    );

    scene.add(asteroid);
}


/* =========================================================
   SHOOTING STARS
========================================================= */

const shootingStars = [];

for(let i=0;i<8;i++){

    const geometry =
        new THREE.BufferGeometry();

    const points = [

        new THREE.Vector3(0,0,0),

        new THREE.Vector3(-8,2,0)

    ];

    geometry.setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:0
        });

    const line =
        new THREE.Line(
            geometry,
            material
        );

    line.position.set(
        (Math.random()-.5)*250,
        (Math.random()-.5)*150,
        (Math.random()-.5)*250
    );

    scene.add(line);

    shootingStars.push({
        object:line,
        timer:Math.random()*500
    });
}


/* =========================================================
   PLANET DESCRIPTIONS
========================================================= */

function getPlanetDescription(name){

    const descriptions = {

        Mercury:
        "Mercury is the closest planet to the Sun and the smallest planet in our Solar System.",

        Venus:
        "Venus has a very thick atmosphere and is the hottest planet in the Solar System.",

        Earth:
        "Earth is our home planet. It has liquid water, a protective atmosphere and one natural satellite — the Moon.",

        Mars:
        "Mars is called the Red Planet because iron-rich minerals on its surface give it a reddish appearance.",

        Jupiter:
        "Jupiter is the largest planet in the Solar System. It is a gas giant famous for its huge storms.",

        Saturn:
        "Saturn is a gas giant famous for its beautiful rings made mostly of ice and rocky material.",

        Uranus:
        "Uranus is an ice giant with a blue-green appearance. Its axis is tilted dramatically.",

        Neptune:
        "Neptune is the farthest major planet from the Sun and has some of the fastest winds in the Solar System."

    };

    return descriptions[name] ||
        "A fascinating planet in our Solar System.";
}


/* =========================================================
   PLANET CLICK / ZOOM
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

let selectedPlanet = null;

let zooming = false;

let targetPosition =
    new THREE.Vector3();

let targetLookAt =
    new THREE.Vector3();


function selectPlanet(planet){

    selectedPlanet =
        planet;

    const data =
        planet.userData;

    document.getElementById(
        "planetName"
    ).textContent =
        "🌍 "+data.name;

    document.getElementById(
        "planetInfo"
    ).innerHTML =

        "<b>📍 Distance from Sun</b><br>"+
        data.info[0]+
        "<br><br>"+

        "<b>📏 Diameter</b><br>"+
        data.info[1]+
        "<br><br>"+

        "<b>🔄 Orbital Period</b><br>"+
        data.info[2]+
        "<br><br>"+

        "<b>🌎 Rotation Period</b><br>"+
        data.info[3]+
        "<br><br>"+

        "<b>✨ About "+data.name+"</b><br>"+
        getPlanetDescription(data.name);

    document.getElementById(
        "info"
    ).style.display =
        "block";


    /* Smooth zoom */

    const worldPosition =
        new THREE.Vector3();

    planet.getWorldPosition(
        worldPosition
    );

    const direction =
        camera.position
        .clone()
        .sub(worldPosition)
        .normalize();

    const zoomDistance =
        Math.max(
            data.size*4,
            10
        );

    targetPosition =
        worldPosition
        .clone()
        .add(
            direction.multiplyScalar(
                zoomDistance
            )
        );

    targetLookAt =
        worldPosition.clone();

    zooming = true;

}


/* =========================================================
   SAFE CLICK DETECTION
========================================================= */

let pointerDownX = 0;
let pointerDownY = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    function(event){

        pointerDownX =
            event.clientX;

        pointerDownY =
            event.clientY;

    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function(event){

        const moved =
            Math.hypot(
                event.clientX-pointerDownX,
                event.clientY-pointerDownY
            );

        /* Don't select when dragging */

        if(moved > 8) return;

        mouse.x =
            (event.clientX/window.innerWidth)*2-1;

        mouse.y =
            -(event.clientY/window.innerHeight)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                planets,
                false
            );

        if(hits.length){

            selectPlanet(
                hits[0].object
            );

        }

    }
);


/* =========================================================
   ZOOM UPDATE
========================================================= */

function updatePlanetZoom(){

    if(!zooming) return;

    camera.position.lerp(
        targetPosition,
        .055
    );

    controls.target.lerp(
        targetLookAt,
        .055
    );

    if(
        camera.position.distanceTo(
            targetPosition
        ) < .15
    ){

        zooming = false;

    }

}


/* =========================================================
   BACK TO SOLAR SYSTEM
========================================================= */

document.getElementById(
    "backToSystem"
).addEventListener(
    "click",
    function(){

        selectedPlanet = null;

        targetPosition.set(
            0,
            75,
            165
        );

        targetLookAt.set(
            0,
            0,
            0
        );

        zooming = true;

        document.getElementById(
            "info"
        ).style.display =
            "none";

    }
);


/* =========================================================
   CONTROLS
========================================================= */

let paused = false;

let showOrbits = true;

let showLabels = true;

let speedMultiplier = 1;


/* PAUSE */

document.getElementById(
    "pauseBtn"
).addEventListener(
    "click",
    function(){

        paused = !paused;

        this.textContent =
            paused
            ? "▶ Play"
            : "⏸ Pause";

    }
);


/* RESET */

document.getElementById(
    "resetBtn"
).addEventListener(
    "click",
    function(){

        selectedPlanet = null;

        targetPosition.set(
            0,
            75,
            165
        );

        targetLookAt.set(
            0,
            0,
            0
        );

        zooming = true;

        document.getElementById(
            "info"
        ).style.display =
            "none";

    }
);


/* ORBITS */

document.getElementById(
    "orbitBtn"
).addEventListener(
    "click",
    function(){

        showOrbits =
            !showOrbits;

        planetGroups.forEach(
            function(group){

                group.userData.orbit.visible =
                    showOrbits;

            }
        );

        this.textContent =
            showOrbits
            ? "⭕ Hide Orbits"
            : "⭕ Show Orbits";

    }
);


/* LABELS */

document.getElementById(
    "labelBtn"
).addEventListener(
    "click",
    function(){

        showLabels =
            !showLabels;

        planetGroups.forEach(
            function(group){

                group.userData.label.visible =
                    showLabels;

            }
        );

        this.textContent =
            showLabels
            ? "🏷 Hide Labels"
            : "🏷 Show Labels";

    }
);


/* SPEED */

document.getElementById(
    "speed"
).addEventListener(
    "input",
    function(){

        speedMultiplier =
            parseFloat(this.value);

    }
);


/* =========================================================
   ANIMATION
========================================================= */

let clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        clock.getDelta();


    /* PLANETS */

    if(!paused){

        planetGroups.forEach(
            function(group){

                const data =
                    group.userData;

                data.angle +=
                    data.speed *
                    speedMultiplier;

                group.position.x =
                    Math.cos(data.angle) *
                    data.distance;

                group.position.z =
                    Math.sin(data.angle) *
                    data.distance;

                const planet =
                    group.children[0];

                planet.rotation.y +=
                    data.rotation *
                    speedMultiplier;


                /* Moon */

                if(data.moon){

                    data.moon.rotation.y +=
                        .03 *
                        speedMultiplier;

                }

            }
        );


        /* Sun rotation */

        sun.rotation.y +=
            .002 *
            speedMultiplier;

        glow.rotation.y -=
            .001 *
            speedMultiplier;


        /* Stars */

        stars.rotation.y +=
            .00003 *
            speedMultiplier;

    }


    /* Shooting stars */

    shootingStars.forEach(
        function(item){

            item.timer -= delta*60;

            if(item.timer < 0){

                item.object.material.opacity =
                    .8;

                item.object.position.x -=
                    .8;

                item.object.position.y +=
                    .25;

                if(
                    item.object.position.x < -150
                ){

                    item.object.position.set(
                        150,
                        Math.random()*100-50,
                        Math.random()*200-100
                    );

                    item.timer =
                        100+Math.random()*300;

                    item.object.material.opacity =
                        0;

                }

            }

        }
    );


    updatePlanetZoom();

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   START
========================================================= */

animate();

</script>

</html>
